<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Encore Beach Club 3D map</title>
<style>
  :root { --bg: #15202b; --panel: rgba(20, 28, 38, 0.86); --fg: #f1efe8; --accent: #f08a2e; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); font: 14px/1.4 system-ui, sans-serif; }
  #app { position: fixed; inset: 0; }
  canvas { display: block; }
  #hud { position: absolute; left: 16px; top: 16px; max-width: 300px; background: var(--panel); border-radius: 10px; padding: 12px 14px; backdrop-filter: blur(6px); }
  #hud h1 { font-size: 16px; margin: 0 0 4px; }
  #hud p { margin: 4px 0; opacity: 0.85; }
  #pick { margin-top: 8px; padding-top: 8px; border-top: 1px solid rgba(255,255,255,0.15); min-height: 40px; }
  #pick b { color: var(--accent); font-size: 18px; }
  #find { display: flex; gap: 6px; margin-top: 8px; }
  #find input { flex: 1; padding: 6px 8px; border-radius: 6px; border: 1px solid #556; background: #0f161e; color: var(--fg); }
  #find button, #hud label { padding: 6px 10px; border-radius: 6px; border: 0; background: var(--accent); color: #111; font-weight: 600; cursor: pointer; }
  #hud label { display: inline-block; margin-top: 8px; background: #2b3a4a; color: var(--fg); font-weight: 500; }
  #status { position: absolute; right: 16px; bottom: 16px; background: var(--panel); padding: 6px 10px; border-radius: 8px; opacity: 0.8; }
  @media (max-width: 600px) { #hud { left: 8px; right: 8px; top: 8px; max-width: none; } }
</style>
</head>
<body>
<div id="app"></div>
<div id="hud">
  <h1>Encore Beach Club</h1>
  <p>Stylized prototype map. Drag to orbit, scroll to zoom, right-drag to pan. Click a table to highlight it.</p>
  <div id="find"><input id="q" placeholder="Table number, e.g. 401" inputmode="numeric"><button id="go">Find</button></div>
  <label><input type="checkbox" id="roofs" checked> Show roofs</label>
  <div id="pick">Nothing selected.</div>
</div>
<div id="status">Loading…</div>

<script type="importmap">
{ "imports": { "three": "./vendor/three.module.js" } }
</script>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from './vendor/GLTFLoader.js';
import { DRACOLoader } from './vendor/DRACOLoader.js';
import { OrbitControls } from './vendor/OrbitControls.js';

const app = document.getElementById('app');
const status = document.getElementById('status');
const pick = document.getElementById('pick');

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.1;
app.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x9ec5e8);
scene.fog = new THREE.Fog(0x9ec5e8, 250, 600);

// glTF is Y-up. Blender's +Y (toward the pools) becomes -Z here.
const camera = new THREE.PerspectiveCamera(45, innerWidth / innerHeight, 0.5, 2000);
camera.position.set(-60, 55, 70);
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 0, -15);
controls.maxPolarAngle = Math.PI / 2 - 0.02;
controls.enableDamping = true;

scene.add(new THREE.HemisphereLight(0xdfeeff, 0x8a7a60, 1.2));
const sun = new THREE.DirectionalLight(0xfff2dc, 2.4);
sun.position.set(-60, 90, 40);
scene.add(sun);

const ground = new THREE.Mesh(new THREE.CircleGeometry(400, 48),
  new THREE.MeshLambertMaterial({ color: 0x7a8a7a }));
ground.rotation.x = -Math.PI / 2;
ground.position.y = -0.35;
scene.add(ground);

const draco = new DRACOLoader();
draco.setDecoderPath('./vendor/draco/');
const loader = new GLTFLoader();
loader.setDRACOLoader(draco);

const tables = new Map();      // "401" -> Object3D
const roofs = [];
let selected = null;

loader.load('./encore-beach-club.glb', (gltf) => {
  scene.add(gltf.scene);
  gltf.scene.traverse((o) => {
    if (!o.isMesh) return;
    if (o.name.startsWith('T_')) tables.set(o.name.slice(2), o);
    if (/Roof/.test(o.name)) roofs.push(o);
  });
  status.textContent = `${tables.size} tables loaded`;
}, (ev) => {
  if (ev.total) status.textContent = `Loading ${(ev.loaded / 1024).toFixed(0)} / ${(ev.total / 1024).toFixed(0)} KB`;
}, (err) => { status.textContent = 'Failed to load GLB (serve over http, not file://)'; console.error(err); });

function describe(o) {
  const d = o.userData || {};
  return `<b>Table ${d.number ?? o.name.slice(2)}</b><br>${(d.type || '').replace(/_/g, ' ')}<br><span style="opacity:.7">${d.zone || ''}</span>`;
}

function select(o) {
  if (selected) { selected.material = selected.userData._mat; selected = null; }
  if (!o) { pick.textContent = 'Nothing selected.'; return; }
  o.userData._mat = o.material;
  o.material = o.material.clone();
  o.material.emissive = new THREE.Color(0xf08a2e);
  o.material.emissiveIntensity = 0.9;
  selected = o;
  pick.innerHTML = describe(o);
}

const ray = new THREE.Raycaster();
const ndc = new THREE.Vector2();
let downAt = null;
renderer.domElement.addEventListener('pointerdown', (e) => { downAt = [e.clientX, e.clientY]; });
renderer.domElement.addEventListener('pointerup', (e) => {
  if (!downAt || Math.hypot(e.clientX - downAt[0], e.clientY - downAt[1]) > 4) return;
  ndc.set((e.clientX / innerWidth) * 2 - 1, -(e.clientY / innerHeight) * 2 + 1);
  ray.setFromCamera(ndc, camera);
  const hit = ray.intersectObjects([...tables.values()], false)[0];
  select(hit ? hit.object : null);
});

function flyTo(o) {
  const box = new THREE.Box3().setFromObject(o);
  const c = box.getCenter(new THREE.Vector3());
  controls.target.copy(c);
  camera.position.set(c.x - 14, c.y + 16, c.z + 18);
}
document.getElementById('go').onclick = () => {
  const q = document.getElementById('q').value.trim().toUpperCase();
  const o = tables.get(q);
  if (o) { select(o); flyTo(o); } else { pick.textContent = `No table "${q}".`; }
};
document.getElementById('q').addEventListener('keydown', (e) => { if (e.key === 'Enter') document.getElementById('go').click(); });
document.getElementById('roofs').onchange = (e) => roofs.forEach((r) => (r.visible = e.target.checked));

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

renderer.setAnimationLoop(() => { controls.update(); renderer.render(scene, camera); });
</script>
</body>
</html>
